<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript" src="d3/d3.v7.js"></script>
</head>
<style>
    .body{
        text-align: center;
    }
    .scatterplot-container{
        border: none;
        border-radius: 7px;
        box-shadow: 0px 0px 7px 2px grey;
    }
</style>
<body>
    <div class="scatterplot-container"></div>

    <script>
        let dataset =   [
                            [5, 20], [480, 90], [250, 50], [100, 33], [330, 95],
                            [410, 12], [475, 44], [25, 67], [85, 21], [220, 88]
                        ];

        let svgWidth = 600
        let svgHeight = 200
        let padding = 25

        let xScale = d3.scaleLinear()
                        .domain([0, d3.max(dataset, function(d){
                            return d[0]
                        })])
                        .range([padding, svgWidth - padding])


        let yScale = d3.scaleLinear()
                        .domain([0, d3.max(dataset, function(d){
                            return d[1]
                        })])
                        .range([svgHeight - padding, padding])

        let rScale = d3.scaleLinear()
                        .domain([0, d3.max(dataset, function(d){
                            return d[1]
                        })])
                        .range([2, 5])

        let svg = d3.select(".scatterplot-container")
                        .append("svg")
                        .attr("width", svgWidth)
                        .attr("height", svgHeight)

        let points = svg.selectAll("circle")
                        .data(dataset).enter()
                        .append("circle")
                        .attr("cx", function(d){
                            return xScale(d[0])
                        })
                        .attr("cy", function(d){
                            return yScale(d[1])
                        })
                        .attr("r", function(d){
                            return rScale(d[1])
                        })
                        .attr("fill", function(d){
                            return `rgb(0, 0, ${d * 4})`
                        })

        let xAxis = d3.axisBottom(xScale)

        svg.append("g")
            .attr("transform", `translate(0, ${svgHeight-padding})`)
            .attr("class", "xAxis")
            .call(xAxis)

        let yAxis = d3.axisLeft(yScale)

        svg.append("g")
        .attr("transform", `translate(${padding}, 0)`)
        .attr("class", "yAxis")
        .call(yAxis)

        function updateData(){
            let numValues = dataset.length
            dataset = []
            for(let i = 0; i < numValues; i++){
                let xValue = Math.floor(Math.random() * 200)
                let yValue = Math.floor(Math.random() * 200)
                dataset.push([xValue, yValue])
            }

            xScale.domain([0, d3.max(dataset, function(d){
                    return d[0]
                })])
                .range([padding, svgWidth - padding])

            yScale.domain([0, d3.max(dataset, function(d){
                    return d[1]
                })])
                .range([svgHeight - padding, padding])

            rScale.domain([0, d3.max(dataset, function(d){
                    return d[1]
                })])
                .range([2, 5])

            svg.selectAll("circle")
                .data(dataset)
                .transition()
                .delay(function(d, i){
                    return i/dataset.length * 1000
                })
                .ease(d3.easeBounce)
                .duration(1000)
                .attr("cx", function(d){
                    return xScale(d[0])
                })
                .attr("cy", function(d){
                    return yScale(d[1])
                })
                .attr("r", function(d){
                    return rScale(d[1])
                })
                .attr("fill", function(d){
                            return `rgb(0, 0, ${d[1] * 6})`
                        })

            svg.select(".xAxis")
                .call(d3.axisBottom(xScale))

            svg.select(".yAxis")
                .call(d3.axisLeft(yScale))
                
        }

        setInterval(() => {
            updateData()
        }, 2000)

    </script>
</body>
</html>
