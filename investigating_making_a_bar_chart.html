<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript" src="d3/d3.v7.js"></script>
</head>
<body>
    <script>
        const dataset = [5, 10, 15, 20, 25, 30, 35]

        const svgHeight = 200
        const svgWidth = 500
        const barPadding = 3

        const svg = d3.select("body").append("svg")
                        .attr("height", svgHeight).attr("width", svgWidth)

        const rectangles = svg.selectAll("rect")
                            .data(dataset).enter()
                            .append("rect")
                            .attr("width", function(){
                                return (svgWidth/dataset.length) - barPadding
                            })
                            .attr("height", function(d){
                                return d * 4
                            })
                

        const positionedRectangles = rectangles.attr("x", function(d, i){
                                                    return (i * (svgWidth/dataset.length))
                                                })
                                                .attr("y", function(d){
                                                    return svgHeight - (d*4)
                                                })

        const annotations = svg.selectAll("text")
                                .data(dataset).enter()
                                .append("text")
                                .text(function(d){
                                    return d
                                })
                                .attr("x", function(d, i){
                                    return i * (svgWidth / dataset.length) +(svgWidth/dataset.length - barPadding)/2
                                })
                                .attr("y", function(d){
                                    return svgHeight - (d * 4)
                                })
                                .attr("fill", "blue")
    </script>
</body>
</html>
