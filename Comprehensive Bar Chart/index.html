<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive Bar Chart</title>
    <link rel="stylesheet" href="style.css">
    <script src="/d3/d3.v7.js" type="text/javascript"></script>
</head>
<body>
    <section>
        <h1>Comprehensive Bar Chart</h1>
        <h3>This Bar Chart design comprehensively displays my understanding of <span>D3</span></h3>

        <div class="bar-chart-container"></div>

        <button class="update-dataset">Update Dataset</button>
        <button class="add-bars">Add Bars</button>
        <button class="remove-bars">Remove Bars</button>

        <!-- Hidden Tooltip -->
        <div id="tooltip" class="hidden">
            <p><strong>Important Label</strong></p>
            <p><span id="value">100</span>%</p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
