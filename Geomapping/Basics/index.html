<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geomapping Basics</title>
    <script src="/d3/d3.v7.js" type="text/javascript"></script>
    <style>
        circle:hover{
            fill: blue;
        }
    </style>
</head>
<body>
    <div class="map-container"></div>

    <script>
 
        let svgWidth = 900
        let svgHeight = 500

        let svg = d3.select(".map-container")
                    .append("svg")
                    .attr("width", svgWidth)
                    .attr("height", svgHeight)

        
        let projection = d3.geoAlbersUsa()
                            .translate([svgWidth/2, svgHeight/2])
                            .scale(1000)

        let path = d3.geoPath()
                        .projection(projection)

        
                        
        let color = d3.scaleQuantize()
                        .range(["rgb(237, 248, 233)", "rgb(186, 228, 179)", "rgb(116, 196, 118)", "rgb(49, 163, 84)", "rgb(0, 109, 44)"])


        d3.csv("us-ag-productivity-2004.csv").then(function(data){
             
             color.domain([d3.min(data, function(d){return +d.value}), d3.max(data, function(d){return +d.value})])

             d3.json("us-states.json").then(function(json){

                for(let i=0; i<data.length; i++){

                    let dataState = data[i].state
                    let dataValue = parseFloat(data[i].value)

                    for(let j=0; j < json.features.length; j++){
                        let jsonState = json.features[j].properties.name

                        if(dataState == jsonState){
                            json.features[j].properties.value = dataValue

                            break
                        }
                    }
                }

                svg.selectAll("path")
                    .data(json.features)
                    .enter()
                    .append("path")
                    .attr("d", path)
                    .style("fill", function(d){
                        let value = d.properties.value

                        if(value){
                            return color(value)
                        }else{
                            return "#CCC"
                        }
                    })


                d3.csv("us-cities.csv").then(function(data){

                    svg.selectAll("circle")
                        .data(data)
                        .enter()
                        .append("circle")
                        .attr("cx", function(d){return projection([+d.lng, +d.lat])[0]})
                        .attr("cy", function(d){return projection([+d.lng, +d.lat])[1]})
                        .attr("r", function(d){return Math.sqrt(parseInt(d.population) * 0.00004)})
                        .style("fill", "red")
                        .style("opacity", 0.9)
                        .on("mouseover", function(){return d3.select(this).style("fill", "blue")})
                        .on("mouseout", function(){return d3.select(this).style("fill", "red")})
                })


             })
        })

        
    


    



    </script>
</body>
</html>
