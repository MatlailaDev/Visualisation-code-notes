<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pie Layout</title>
    <script src="/d3/d3.v7.js" type="text/javascript"></script>
    <style>
        body{
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="pie-chart-container"></div>

    <script>
        let dataset = [5, 10, 20, 45, 6, 25]

        let pie = d3.pie()
                    .padAngle(0.01)

        let svgWidth = 300
        let svgHeight = 300

        let outerRadius = svgWidth/2
        let innerRadius = svgWidth/3

        let arc = d3.arc()
                    .innerRadius(innerRadius)
                    .outerRadius(outerRadius)

        let svg = d3.select(".pie-chart-container")
                    .append("svg")
                    .attr("width", svgWidth)
                    .attr("height", svgHeight)

        let arcs = svg.selectAll("g.arc")
                        .data(pie(dataset))
                        .enter()
                        .append("g")
                        .attr("class", "arc")
                        .attr("transform", `translate(${svgWidth/2}, ${svgHeight/2})`)

        let color = d3.scaleOrdinal(d3.schemeDark2 )

        arcs.append("path")
            .attr("fill", function(d, i){return color(i)})
            .attr("d", arc)

        arcs.append("text")
            .attr("transform", function(d){return `translate(${arc.centroid(d)})`})
            .attr("text-anchor", "middle")
            .text(function(d){return d.value})
        

    </script>
</body>
</html>
