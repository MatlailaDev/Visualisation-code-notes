<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript " src="d3/d3.v7.js"></script>
</head>
<body>
    <script>
        const dataset =   [
                            [5, 20], [480, 90], [250, 50], [100, 33], [330, 95],
                            [410, 12], [475, 44], [25, 67], [85, 21], [220, 88]
                        ];

        const svgHeight = 200
        const svgWidth = 700

        const svg = d3.select("body")
                        .append("svg")
                        .attr("width", svgWidth)
                        .attr("height", svgHeight)

        const points = svg.selectAll("circle")
                            .data(dataset).enter()
                            .append("circle")
                            .attr("cx", function(d){
                                return d[0]
                            })
                            .attr("cy", function(d){
                                return d[1]
                            })
                            .attr("r", 5)
                            .attr("fill", "purple")

        const annotations = svg.selectAll("text")
                                .data(dataset).enter()
                                .append("text")
                                .text(function(d){
                                    return "(" + d[0] + "," + d[1] + ")"
                                })
                                .attr("x", function(d){
                                    return d[0]
                                })
                                .attr("y", function(d){
                                    return d[1]
                                })
                                .attr("fill", "red")
                                .attr("font-size", "15")
    </script>
</body>
</html>
