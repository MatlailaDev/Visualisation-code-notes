<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="d3/d3.v7.js" type="text/javascript"></script>

    <style>
        .bar-chart-container{
            display: block;
            margin: auto auto;
            text-align: center;
        }

        button{
            display: block;
            margin: auto;
        }

        .annotations{
            font-size: 13px;
        }

        rect:hover{
            fill: orange
        }
    </style>
</head>
<body>
    <div class="bar-chart-container"></div>
    <button>Add To Chart/ Delete From Chart</button>

    <script>
        let dataset = [{key:0 ,value: 5}, {key:1 ,value: 10}, {key:2 ,value: 15}, {key:3 ,value: 20}, {key:4 ,value: 25}, {key:5 ,value: 30}, {key:6 ,value: 35}, {key:7 ,value: 40}, {key:8 ,value: 45}, {key:9 ,value: 50}, {key:10 ,value: 55}, {key:11 ,value: 60}]

        let svgWidth = 500
        let svgHeight = 200
        let padding = 20

        let key = function(d){
            return d.key
        }

        let xScale = d3.scaleBand()
                        .domain(d3.range(dataset.length))
                        .range([padding, svgWidth - padding])
                        .paddingInner(0.05)

        let yScale = d3.scaleLinear()
                        .domain([0, d3.max(dataset, function(d){
                            return d.value
                        })])
                        .range([svgHeight - padding, padding])

        let svg = d3.select(".bar-chart-container")
                    .append("svg")
                    .attr("width", svgWidth)
                    .attr("height", svgHeight)

        let bars = svg.selectAll("rect")
                        .data(dataset, key).enter()
                        .append("rect")
                        .attr("width", xScale.bandwidth())
                        .attr("height", function(d){
                            return svgHeight - padding - yScale(d.value)
                        })
                        .attr("x", function(d, i){
                            return xScale(i)
                        })
                        .attr("y", function(d){
                            return yScale(d.value)
                        })
                        .attr("fill", function(d){ return `rgb(0, 0, ${d.value * 5})`})
        
        let annotations = svg.selectAll("text")
                                .data(dataset).enter()
                                .append("text")
                                .text(function(d){
                                    return d.value
                                })
                                .attr("x", function(d, i){
                                    return xScale(i) + xScale.bandwidth()/2
                                })
                                .attr("y", function(d){
                                    return yScale(d.value) + 12
                                })
                                .attr("text-anchor" , "middle")
                                .attr("fill", "white")
                                .attr("class", "annotations")

        

        let xAxis = d3.axisBottom(xScale)
                       .tickSizeInner(0)
        
        svg.append("g")
            .attr("transform", `translate(0, ${(svgHeight - padding)})`)
            .attr("class", "xAxis")
            .call(xAxis)

        let yAxis = d3.axisLeft(yScale)

        svg.append("g")
            .attr("transform", `translate(${padding}, 0)`)
            .attr("class", "yAxis")
            .call(yAxis)






        function addToChart(){
            dataset.push({key: 12, value: 25}, {key: 13, value: 15}, {key: 14, value: 40}, {key: 15, value: 35}, {key: 16, value: 10})

            key = function(d){return d.key}

            xScale.domain(d3.range(dataset.length))

            yScale.domain([0, d3.max(dataset, function(d){return d.value})])

            bars = svg.selectAll("rect")
                        .data(dataset, key)
                        .attr("width", xScale.bandwidth())
                        .attr("height", function(d){return svgHeight - padding - yScale(d.value)})
                        .attr("x", function(d, i){return xScale(i)})
                        .attr("y", function(d){return yScale(d.value)})
            
            bars.enter()
                .append("rect")
                .transition()
                .duration(2500)
                .attr("width", xScale.bandwidth())
                .attr("height", function(d){return svgHeight - padding - yScale(d.value)})
                .attr("x", function(d, i){return xScale(i)})
                .attr("y", function(d){return yScale(d.value)})
                .attr("fill", function(d){ return `rgb(0, 0, ${d.value * 5})`})
 

            let annotations = svg.selectAll("text")
                                    .data(dataset, key)
                                    .text(function(d){return d.value})
                                    .attr("x", function(d, i){return xScale(i) + xScale.bandwidth()/2})
                                    .attr("y", function(d){return yScale(d.value) + 11})
                                    .attr("fill", "white")
                                    .attr("text-anchor", "middle")
                                    

            annotations.enter()
                        .append("text")
                        .text(function(d){return d.value})
                        .transition()
                        .duration(2500)
                        .attr("x", function(d, i){return xScale(i) + xScale.bandwidth()/2})
                        .attr("y", function(d){return yScale(d.value) + 11})
                        .attr("fill", "white")
                        .attr("text-anchor", "middle")
                        .attr("class", "annotations")

            xAxis = d3.axisBottom(xScale)
        
            svg.select(".xAxis")
                .transition()
                .duration(1500)
                .call(xAxis)

            yAxis = d3.axisLeft(yScale)

            svg.select(".yAxis")
                .call(yAxis)
        }

        function removeFromChart(){
            dataset.shift()

            key = function(d){return d.key}

            xScale.domain(d3.range(dataset.length))

            yScale.domain([0, d3.max(dataset, function(d){return d.value})])

            let bars = svg.selectAll("rect")
                            .data(dataset,key)
                            .attr("width", xScale.bandwidth())
                            .attr("height", function(d){return svgHeight - padding - yScale(d.value)})
                            .attr("x", function(d, i){return xScale(i)})
                            .attr("y", function(d){return yScale(d.value)})
            
            bars.exit()
                .remove()

            let annotations = svg.selectAll("text.annotations")
                                    .data(dataset, key)
                                    .text(function(d){return d.value})
                                    .attr("x", function(d, i){return xScale(i) + xScale.bandwidth()/2})
                                    .attr("y", function(d){return yScale(d.value) + 11})

            annotations.exit()
                        .remove()

            xAxis = d3.axisBottom(xScale)
        
            svg.select(".xAxis")
                .call(xAxis)

            yAxis = d3.axisLeft(yScale)

            svg.select(".yAxis")
                .call(yAxis)

        }

            


        
        d3.select("button")
          .on("click", function(){

            // addToChart()
            removeFromChart()

        })




    </script>
</body>
</html>
