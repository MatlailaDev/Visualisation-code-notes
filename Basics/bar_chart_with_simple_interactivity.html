<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="d3/d3.v7.js" type="text/javascript"></script>

    <style>
        body{
            display: block;
            margin:  auto auto;
            text-align: center;
        }

        .bar-chart-container{
            border: 1px solid black;
            width: fit-content;
            margin: 10px auto;
            padding: 20px;
        }

        .annotations{
            font-size:  14px;
        }

        rect:hover{
            fill: #FFA500;
        }

        button{
            margin-top: 10px;
            padding: 8px;
        }




        /* Styling for tooltip */
        #tooltip{
            position: absolute;
            width: auto;
            height: auto;
            padding: 10px;
            background-color: white;
            -webkit-border-radius: 10px;
            -moz-border-radius: 10px;
            border-radius: 10px;
            -webkit-box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.4);
            -moz-box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.4);
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }

        #tooltip.hidden{
            display: none;
        }

        #tooltip{
            margin: 0;
            font-family: sans-serif;
            font-size:  12px;
            line-height: 10px;
        }
    </style>

</head>
<body>
    
    <!-- This div is the hidden div where our tooltip lives  -->
    <div id="tooltip" class="hidden">
        <p><strong>Important Label Heading</strong></p>
        <p><span id="value">100</span>%</p>
    </div>


    <div class="bar-chart-container"></div>
    <button>Interact via Button click</button>

    <script>
        let dataset = [{key:0 ,value: 25}, {key:1 ,value: 10},{key:2 ,value: 45},{key:3 ,value: 30},{key:4 ,value: 25},{key:5 ,value: 50},{key:6 ,value: 5},{key:7 ,value: 15}, {key:8 ,value: 55},{key:9 ,value: 45}]

        let months = ["Jan", "Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov", "Dec"]

        let key = function(d){return d.key}

        let svgWidth = 600
        let svgHeight = 250
        let padding = 20

        let xScale = d3.scaleBand()
                        .domain(d3.range(dataset.length))
                        .range([padding, svgWidth - padding])
                        .paddingInner(0.05)

        let yScale = d3.scaleLinear()
                        .domain([0, d3.max(dataset, function(d){return d.value})])
                        .range([svgHeight - padding, padding])

        let dateScale = d3.scaleBand()
                            .domain(months)
                            .range([padding, svgWidth - padding])

        let svg = d3.select(".bar-chart-container")
                    .append("svg")
                    .attr("width", svgWidth)
                    .attr("height", svgHeight)

        let bars = svg.selectAll("rect")
                        .data(dataset, key)
                        .enter()
                        .append("rect")
                        .attr("width", xScale.bandwidth())
                        .attr("height", function(d){return svgHeight - padding - yScale(d.value)})
                        .attr("x", function(d, i){return xScale(i)})
                        .attr("y", function(d){return yScale(d.value)})
                        .attr("fill", function(d){return `rgb(0, 0, ${d.value * 5})`})
                        .on("click", function(){sortBars()})
                        // .append("title")
                        // .text(function(d){return d.value}) //This is the simple method to create tooltips
                        // .on("mouseover", function(event, d){ //This is the intermediate approach to creating tooltips
                        //     d3.select("#tooltip").remove()

                        //     let xPosition = parseFloat(d3.select(this).attr("x")) + xScale.bandwidth()/2;
                        //     let yPosition = parseFloat(d3.select(this).attr("y")) + 14;

                        //     svg.append("text")
                        //         .attr("id", "tooltip")
                        //         .attr("x", xPosition)
                        //         .attr("y", yPosition)
                        //         .attr("text-anchor", "middle")
                        //         .attr("font-family", "sans-serif")
                        //         .attr("font-size", "11px")
                        //         .attr("font-weight", "bold")
                        //         .attr("fill", "white")
                        //         .text(d.value)

                        // })
                        // .on("mouseout", function(){d3.select("#tooltip").remove()})
                        .on("mouseover", function(event, d){
                           
                            let xPosition = parseFloat(d3.select(this).attr("x")) + xScale.bandwidth()/2
                            let yPosition = parseFloat(d3.select(this).attr("y"))/2 + svgHeight/2

                            d3.select("#tooltip")
                                .style("left", `${xPosition}px`)
                                .style("top", `${yPosition}px`)
                                .select("#value")
                                .text(d.value)

                            d3.select("#tooltip").classed("hidden", false)
                        })
                        .on("mouseout", function(){
                            d3.select("#tooltip").classed("hidden", true)
                        })

        // let annotations = svg.selectAll("text")
        //                         .data(dataset, key) 
        //                         .enter()
        //                         .append("text")
        //                         .text(function(d){return d.value})
        //                         .attr("x", function(d, i){return xScale(i) + xScale.bandwidth()/2})
        //                         .attr("y", function(d){return yScale(d.value) + 14})
        //                         .attr("text-anchor", "middle")
        //                         .attr("fill", "white")
        //                         .attr("class", "annotations")

        
        svg.append("g")
            .attr("class", "xAxis")
            .attr("transform", `translate(0, ${svgHeight - padding})`)
            .call(d3.axisBottom(xScale))
        
        svg.append("g")
            .attr("class", "yAxis")
            .attr("transform", `translate(${padding}, 0)`)
            .call(d3.axisLeft(yScale))


        let sortOrder = false

        let sortBars = function(){

            // Flip value of sortOrder
            sortOrder = !sortOrder

            svg.selectAll("rect")
                .sort(function(a, b){
                    if(sortOrder){
                        return d3.ascending(a.value, b.value)
                    }else{
                        return d3.descending(a.value, b.value)
                    }
                })
                .transition()
                .delay(function(d, i){return i * 50})
                .duration(1000)
                .attr("x", function(d, i){return xScale(i)})

            svg.selectAll("text")
                .sort(function(a, b){
                    if(sortOrder){
                        return d3.ascending(a.value, b.value)
                    }else{
                        return d3.descending(a.value, b.value)
                    }
                })
                .transition()
                .delay(function(d, i){return i * 50})
                .duration(1000)
                .attr("x", function(d, i){return xScale(i) + xScale.bandwidth()/2})
                .attr("y", function(d){return yScale(d.value) + 14})
                .attr("text-anchor", "middle")
            }
    </script>
</body>
</html>
